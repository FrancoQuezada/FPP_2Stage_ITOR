name: ITOR submission build

on:
  push:
    branches: [main]
    paths:
      - "ITOR_submission/**"
      - ".github/workflows/itor-submission.yml"
  workflow_dispatch:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out manuscript
        uses: actions/checkout@v4
      - name: Compile LaTeX and BibTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: ITOR_submission
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          test -s ITOR_submission/main.pdf
          if command -v pdfinfo >/dev/null 2>&1; then
            pages=$(pdfinfo ITOR_submission/main.pdf | awk '/^Pages:/ {print $2}')
            echo "PDF page count: $pages"
            if [ "$pages" -gt 25 ]; then
              echo "::warning::ITOR limits manuscripts to 25 pages. PDF has $pages pages."
            fi
          fi
          cd ITOR_submission
          zip -q -r ITOR_submission_sources.zip main.tex itor.cls itor.bst references.bib fig
          unzip -t ITOR_submission_sources.zip
      - name: Upload submission
        uses: actions/upload-artifact@v4
        with:
          name: ITOR_submission-ready
          path: |
            ITOR_submission/main.pdf
            ITOR_submission/ITOR_submission_sources.zip
          retention-days: 30
          if-no-files-found: error
